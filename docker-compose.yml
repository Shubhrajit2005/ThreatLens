services:
  mongodb:
    image: mongo:8
    container_name: threatlens-mongodb
    restart: unless-stopped
    volumes:
      - mongodb_data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  server:
    build:
      context: ./server
    container_name: threatlens-server
    restart: unless-stopped
    env_file:
      - ./docker.env
    environment:
      PORT: 5000
      NODE_ENV: production
      MONGODB_URI: mongodb://mongodb:27017/threatlens
      CLIENT_URL: http://localhost:5173
      JWT_EXPIRES_IN: 1d
    depends_on:
      mongodb:
        condition: service_healthy
    ports:
      - "5000:5000"

  client:
    build:
      context: ./client
    container_name: threatlens-client
    restart: unless-stopped
    depends_on:
      - server
    ports:
      - "5173:80"

volumes:
  mongodb_data: